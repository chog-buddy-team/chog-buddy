<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'" />
    <title>Chog chat history &amp; diary</title>
    <style>
      body { margin: 0; font: 13px/1.4 system-ui, sans-serif; background: #f4f1f7; color: #1b1420; }
      h1 { margin: 0; padding: 10px 14px 6px; font-size: 14px; }
      #list { display: flex; flex-direction: column; gap: 8px; padding: 12px; }
      .msg { max-width: 78%; padding: 7px 10px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
      .me { align-self: flex-end; background: #6e54ff; color: #fff; border-bottom-right-radius: 4px; }
      .chog { align-self: flex-start; background: #fff; border-bottom-left-radius: 4px; box-shadow: 0 1px 2px #00000026; }
      time { display: block; margin-top: 3px; font-size: 10px; opacity: 0.7; }
      .empty { margin-top: 48px; text-align: center; opacity: 0.6; }
      header { position: sticky; top: 0; background: #f4f1f7; border-bottom: 1px solid #0000001a; }
      nav { display: flex; gap: 6px; padding: 0 14px 8px; }
      nav button { font: inherit; padding: 3px 12px; border: 1px solid #6e54ff; border-radius: 999px; background: transparent; color: inherit; cursor: pointer; }
      nav button[aria-selected='true'] { background: #6e54ff; color: #fff; }
      .entry { padding: 9px 12px; border-radius: 10px; background: #fff; box-shadow: 0 1px 2px #00000026; white-space: pre-wrap; overflow-wrap: anywhere; }
      .entry h2 { margin: 0 0 4px; font-size: 12px; opacity: 0.7; }
      @media (prefers-color-scheme: dark) {
        body, header { background: #1b1420; color: #eee; }
        .chog, .entry { background: #2c2233; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="title">Chat history</h1>
      <nav role="tablist">
        <button id="tab-chats" type="button" role="tab" aria-selected="true">Chats</button>
        <button id="tab-diary" type="button" role="tab" aria-selected="false">Diary</button>
      </nav>
    </header>
    <main id="list"></main>
    <script src="history.js"></script>
  </body>
</html>
