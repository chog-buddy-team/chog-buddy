<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src https: data:; style-src 'self' 'unsafe-inline'" />
    <style>
      html, body { margin: 0; background: transparent; overflow: hidden; user-select: none; font-family: system-ui, sans-serif; }
      #wrap { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 120px; height: 120px; cursor: grab; }
      #chog { width: 100%; height: 100%; animation: bob 0.6s ease-in-out infinite alternate; transform-origin: 50% 100%; -webkit-user-drag: none; }
      #chog.flip { scale: -1 1; }
      #chog.squash { animation: squash 0.25s ease-out; }
      @keyframes bob { from { translate: 0 0; } to { translate: 0 -4px; } }
      @keyframes squash { 0% { transform: scale(1.15, 0.85); } 100% { transform: scale(1, 1); } }
      #bubble { position: absolute; top: 0; left: 4px; right: 4px; padding: 6px 8px; border-radius: 10px; background: #fff; color: #222;
        font-size: 11px; line-height: 1.3; box-shadow: 0 2px 6px rgba(0,0,0,.25); opacity: 0; transition: opacity .2s; pointer-events: none; }
      #bubble.show { opacity: 1; }
    </style>
  </head>
  <body>
    <div id="bubble"></div>
    <div id="wrap"><img id="chog" alt="" /></div>
    <script src="pet.js"></script>
  </body>
</html>
